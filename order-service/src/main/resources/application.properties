spring.application.name=order-service

server.port=8081

spring.datasource.url=jdbc:postgresql://${ORDER_DB_HOST:localhost}:${ORDER_DB_PORT:5434}/${POSTGRES_DB:orderdb}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway owns the schema; Hibernate only validates it matches the entities.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Temporal
temporal.service-address=${TEMPORAL_ADDRESS:127.0.0.1:7233}
# Demo only: durable Temporal timer after ODM/Drools RETRY / COMPENSATE / inventory FAIL_ORDER
# decisions so the transitions are visible in Temporal UI. Keep disabled outside demos.
temporal.demo.delay-enabled=${TEMPORAL_DEMO_DELAY_ENABLED:true}
temporal.demo.delay-seconds=${TEMPORAL_DEMO_DELAY_SECONDS:10}

# Downstream service base URLs - never hardcode these in source, only here.
inventory.service.base-url=${INVENTORY_SERVICE_URL:http://localhost:8082}
payment.service.base-url=${PAYMENT_SERVICE_URL:http://localhost:8083}
odm.service.base-url=${ODM_SERVICE_URL:http://localhost:8085}

# Solace PubSub+
solace.java.host=${SOLACE_HOST:tcp://localhost:55555}
solace.java.msgVpn=${SOLACE_VPN:default}
solace.java.clientUsername=${SOLACE_CLIENT_USERNAME:default}
solace.java.clientPassword=${SOLACE_CLIENT_PASSWORD:}
