spring.application.name=odm-service

server.port=8085

spring.datasource.url=jdbc:postgresql://${ODM_DB_HOST:localhost}:${ODM_DB_PORT:5438}/${POSTGRES_DB:odmdb}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Business rule config consumed by Drools via DeviationApplicationService - how many
# payment attempts are allowed before ODM/Drools decides to COMPENSATE.
payment.max-attempts=3

solace.java.host=${SOLACE_HOST:tcp://localhost:55555}
solace.java.msgVpn=${SOLACE_VPN:default}
solace.java.clientUsername=${SOLACE_CLIENT_USERNAME:default}
solace.java.clientPassword=${SOLACE_CLIENT_PASSWORD:}

# --- ODM autorecovery (Scenarios 5/6) ---------------------------------------------
# ODM's own Temporal worker polls odm-autorecovery-queue (not order-lifecycle-task-queue).
temporal.service-address=${TEMPORAL_ADDRESS:127.0.0.1:7233}
# Auto-recovery policy: (deviation type) -> markets where automated recovery is enabled.
# Unlisted (type, market) pairs are disabled, so Drools decides MANUAL for them.
odm.autorecovery.enabled-markets[SHORT_PICK]=US,IN
# Background reconciler: re-starts workflows for unresolved deviations whose workflow never
# started, or whose last run ended FAILED/TERMINATED/CANCELED/TIMED_OUT. Off if unset.
odm.autorecovery.reconciliation.enabled=${ODM_RECONCILIATION_ENABLED:true}
odm.autorecovery.reconciliation.interval-ms=30000
odm.autorecovery.reconciliation.stale-after-seconds=30
odm.autorecovery.reconciliation.max-workflow-restarts=3
# DeviationResolved events are published to Solace topic order/deviation/resolved.
# Demo-only downstream consumer (own Solace session) that logs each received event.
odm.demo.deviation-resolved-consumer.enabled=${ODM_DEMO_RESOLVED_CONSUMER_ENABLED:true}
