spring.application.name=odm-service

server.port=8085

spring.datasource.url=jdbc:postgresql://${ODM_DB_HOST:localhost}:${ODM_DB_PORT:5438}/${POSTGRES_DB:odmdb}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Business rule config consumed by Drools via DeviationApplicationService - how many
# payment attempts are allowed before ODM/Drools decides to COMPENSATE.
payment.max-attempts=3

solace.java.host=${SOLACE_HOST:tcp://localhost:55555}
solace.java.msgVpn=${SOLACE_VPN:default}
solace.java.clientUsername=${SOLACE_CLIENT_USERNAME:default}
solace.java.clientPassword=${SOLACE_CLIENT_PASSWORD:}

# --- ODM autorecovery (Scenarios 5/6) ---------------------------------------------
# ODM's own Temporal worker polls odm-autorecovery-queue (not order-lifecycle-task-queue).
temporal.service-address=${TEMPORAL_ADDRESS:127.0.0.1:7233}
# Auto-recovery policy: (deviation type) -> markets where automated recovery is enabled.
# Unlisted (type, market) pairs are disabled, so Drools decides MANUAL for them.
odm.autorecovery.enabled-markets[SHORT_PICK]=US,IN
# Background reconciler: re-starts workflows for unresolved deviations whose workflow never
# started, or whose last run ended FAILED/TERMINATED/CANCELED/TIMED_OUT. Off if unset.
odm.autorecovery.reconciliation.enabled=${ODM_RECONCILIATION_ENABLED:true}
odm.autorecovery.reconciliation.interval-ms=30000
odm.autorecovery.reconciliation.stale-after-seconds=30
odm.autorecovery.reconciliation.max-workflow-restarts=3
# DeviationResolved events are published to Solace topic order/deviation/resolved.
# Demo-only downstream consumer (own Solace session) that logs each received event.
odm.demo.deviation-resolved-consumer.enabled=${ODM_DEMO_RESOLVED_CONSUMER_ENABLED:true}

# --- ODM Full-Serve deviation lifecycle -------------------------------------------
# Own Temporal worker on odm-fullserve-queue (FullServeConfiguration); workflow ID per order:
# fullserve-deviation-<orderId>.
# Alert configuration (demo values, not business-confirmed): markets where it exists and is
# enabled, the consumers to alert, and when each alert falls due after deviation creation.
odm.fullserve.alerts.enabled-markets=${ODM_FULLSERVE_ALERT_MARKETS:US,GB,DE}
odm.fullserve.alerts.consumers=SPM,DYNAMICS
odm.fullserve.alerts.schedule=${ODM_FULLSERVE_ALERT_SCHEDULE:0s,2m,10m}
# Solace destinations (defaults match the ODM Temporal design; confirm before production use).
odm.fullserve.destinations.signal-queue=${ODM_FULLSERVE_SIGNAL_QUEUE:ODM.DEVIATION.SIGNAL.Q}
odm.fullserve.destinations.signal-topic=odm/in/deviation/signal/>
odm.fullserve.destinations.update-queue=${ODM_FULLSERVE_UPDATE_QUEUE:ODM.DEVIATION.UPDATE.Q}
odm.fullserve.destinations.update-topic=odm/in/deviation/update/>
odm.fullserve.destinations.deviation-created=odm/out/deviation/created
odm.fullserve.destinations.consumer-alert=odm/out/deviation/alert/{consumer}/{orderId}
odm.fullserve.destinations.alert-closure=odm/out/deviation/closed
odm.fullserve.destinations.deviation-closed=odm/out/deviation/lcm-closed
# Queue listener (client ack). provision-queues creates the queues on a LOCAL broker only.
odm.fullserve.solace.listener-enabled=${ODM_FULLSERVE_LISTENER_ENABLED:true}
odm.fullserve.solace.provision-queues=${ODM_FULLSERVE_PROVISION_QUEUES:true}
# Demo-only simulated SPM/Dynamics/O360 subscriber (GET /fullserve/demo/received).
odm.fullserve.solace.demo-consumer-enabled=${ODM_FULLSERVE_DEMO_CONSUMER_ENABLED:true}
