services:

  # ---------------------------------------------------------------------------
  # One PostgreSQL database per business service (see docs/architecture.md for
  # why each service owns its own schema and never reaches into another's).
  # ---------------------------------------------------------------------------

  order-postgres:
    image: postgres:16
    container_name: kotlin-ol-order-postgres
    environment:
      POSTGRES_DB: ${ORDER_POSTGRES_DB}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - order-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 5s
      timeout: 5s
      retries: 20

  inventory-postgres:
    image: postgres:16
    container_name: kotlin-ol-inventory-postgres
    environment:
      POSTGRES_DB: ${INVENTORY_POSTGRES_DB}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5436:5432"
    volumes:
      - inventory-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 5s
      timeout: 5s
      retries: 20

  payment-postgres:
    image: postgres:16
    container_name: kotlin-ol-payment-postgres
    environment:
      POSTGRES_DB: ${PAYMENT_POSTGRES_DB}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5437:5432"
    volumes:
      - payment-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 5s
      timeout: 5s
      retries: 20

  odm-postgres:
    image: postgres:16
    container_name: kotlin-ol-odm-postgres
    environment:
      POSTGRES_DB: ${ODM_POSTGRES_DB}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5438:5432"
    volumes:
      - odm-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ---------------------------------------------------------------------------
  # Temporal: durable workflow orchestration for the order lifecycle.
  # ---------------------------------------------------------------------------

  temporal-postgresql:
    image: postgres:16
    container_name: kotlin-ol-temporal-postgresql
    environment:
      POSTGRES_PASSWORD: temporal
      POSTGRES_USER: temporal
    ports:
      - "5435:5432"
    networks:
      - temporal-network
    volumes:
      - temporal-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  temporal-admin-tools:
    image: temporalio/admin-tools:1.31.0
    container_name: kotlin-ol-temporal-admin-tools
    restart: on-failure:6
    depends_on:
      temporal-postgresql:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-postgresql
      - SQL_PASSWORD=temporal
    networks:
      - temporal-network
    volumes:
      - ./scripts:/scripts
    entrypoint: ["/bin/sh"]
    command: /scripts/setup-postgres.sh

  temporal:
    image: temporalio/server:1.31.0
    container_name: kotlin-ol-temporal
    depends_on:
      temporal-admin-tools:
        condition: service_completed_successfully
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-postgresql
      - BIND_ON_IP=0.0.0.0
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
    networks:
      - temporal-network
    ports:
      - "7233:7233"
    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7233"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 60

  temporal-create-namespace:
    image: temporalio/admin-tools:1.31.0
    container_name: kotlin-ol-temporal-create-namespace
    restart: on-failure:5
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - DEFAULT_NAMESPACE=default
    networks:
      - temporal-network
    volumes:
      - ./scripts:/scripts
    entrypoint: ["/bin/sh"]
    command: /scripts/create-namespace.sh

  temporal-ui:
    image: temporalio/ui:2.49.1
    container_name: kotlin-ol-temporal-ui
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    networks:
      - temporal-network
    ports:
      - "8080:8080"

  # ---------------------------------------------------------------------------
  # Solace PubSub+ (standard edition): the real business-event backbone. Web
  # management UI is remapped to 8087 so it never collides with Temporal UI's 8080.
  # See docs/solace.md for topic names and publisher/consumer responsibilities.
  # ---------------------------------------------------------------------------

  solace:
    # Pinned (was :latest) so every developer gets the same broker version.
    image: solace/solace-pubsub-standard:10.26.0.8894
    container_name: kotlin-ol-solace
    shm_size: 1g
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    environment:
      - username_admin_globalaccesslevel=admin
      - username_admin_password=${SOLACE_ADMIN_PASSWORD:-admin}
      - system_scaling_maxconnectioncount=100
    ports:
      - "55555:55555" # SMF - what solace.java.host in every service's application.properties points at
      - "8008:8008"   # Web Messaging for Try Me!
      - "8087:8080"    # Solace web management console (remapped from the image's default 8080)
      - "9000:9000"    # REST messaging - stands in for OE/OEP publishing Full-Serve signals in the demo
      - "5550:5550"    # health check port
    volumes:
      # Persist broker config/messages (incl. ODM.DEVIATION.*.Q provisioned by odm-service) so
      # recreating this container (e.g. after a port change) does not wipe the queues.
      - solace-data:/var/lib/solace
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5550/health-check/guaranteed-active || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # ---------------------------------------------------------------------------
  # Application services (optional). Only started with the "apps" profile:
  #   docker compose --profile apps up -d --build
  # Without the profile, `docker compose up -d` starts the infrastructure only and the
  # services are run on the host with ./mvnw spring-boot:run (see README).
  # Inside the compose network, services reach each other by service name, never localhost.
  # One Dockerfile builds every service; the SERVICE build arg picks the Maven module.
  # ---------------------------------------------------------------------------

  odm-service:
    profiles: ["apps"]
    build:
      context: .
      args:
        SERVICE: odm-service
    image: kotlin-ol/odm-service:local
    container_name: kotlin-ol-odm-service
    restart: on-failure:5
    environment:
      SERVER_PORT: "8085"
      ODM_DB_HOST: odm-postgres
      ODM_DB_PORT: "5432"
      POSTGRES_DB: ${ODM_POSTGRES_DB}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      TEMPORAL_ADDRESS: temporal:7233
      SOLACE_HOST: tcp://solace:55555
      # Demo knobs; the defaults are the same as in application.properties.
      ODM_FULLSERVE_ALERT_SCHEDULE: ${ODM_FULLSERVE_ALERT_SCHEDULE:-0s,2m,10m}
      ODM_FULLSERVE_ALERT_MARKETS: ${ODM_FULLSERVE_ALERT_MARKETS:-US,GB,DE}
    ports:
      - "8085:8085"
    networks:
      - default
      - temporal-network
    depends_on:
      odm-postgres:
        condition: service_healthy
      solace:
        condition: service_healthy
      temporal-create-namespace:
        condition: service_completed_successfully
    healthcheck: &app-healthcheck
      # No actuator in this POC: healthy = the HTTP port accepts connections, which Spring
      # Boot opens only after the context (DB migrations, Solace session, Temporal workers) is up.
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/$${SERVER_PORT}' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    stop_grace_period: 30s

  inventory-service:
    profiles: ["apps"]
    build:
      context: .
      args:
        SERVICE: inventory-service
    image: kotlin-ol/inventory-service:local
    container_name: kotlin-ol-inventory-service
    restart: on-failure:5
    environment:
      SERVER_PORT: "8082"
      INVENTORY_DB_HOST: inventory-postgres
      INVENTORY_DB_PORT: "5432"
      POSTGRES_DB: ${INVENTORY_POSTGRES_DB}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SOLACE_HOST: tcp://solace:55555
    ports:
      - "8082:8082"
    depends_on:
      inventory-postgres:
        condition: service_healthy
      solace:
        condition: service_healthy
    healthcheck: *app-healthcheck
    stop_grace_period: 30s

  payment-service:
    profiles: ["apps"]
    build:
      context: .
      args:
        SERVICE: payment-service
    image: kotlin-ol/payment-service:local
    container_name: kotlin-ol-payment-service
    restart: on-failure:5
    environment:
      SERVER_PORT: "8083"
      PAYMENT_DB_HOST: payment-postgres
      PAYMENT_DB_PORT: "5432"
      POSTGRES_DB: ${PAYMENT_POSTGRES_DB}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SOLACE_HOST: tcp://solace:55555
    ports:
      - "8083:8083"
    depends_on:
      payment-postgres:
        condition: service_healthy
      solace:
        condition: service_healthy
    healthcheck: *app-healthcheck
    stop_grace_period: 30s

  notification-service:
    profiles: ["apps"]
    build:
      context: .
      args:
        SERVICE: notification-service
    image: kotlin-ol/notification-service:local
    container_name: kotlin-ol-notification-service
    restart: on-failure:5
    environment:
      SERVER_PORT: "8084"
      SOLACE_HOST: tcp://solace:55555
    ports:
      - "8084:8084"
    depends_on:
      solace:
        condition: service_healthy
    healthcheck: *app-healthcheck
    stop_grace_period: 30s

  order-service:
    profiles: ["apps"]
    build:
      context: .
      args:
        SERVICE: order-service
    image: kotlin-ol/order-service:local
    container_name: kotlin-ol-order-service
    restart: on-failure:5
    environment:
      SERVER_PORT: "8081"
      ORDER_DB_HOST: order-postgres
      ORDER_DB_PORT: "5432"
      POSTGRES_DB: ${ORDER_POSTGRES_DB}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      TEMPORAL_ADDRESS: temporal:7233
      SOLACE_HOST: tcp://solace:55555
      INVENTORY_SERVICE_URL: http://inventory-service:8082
      PAYMENT_SERVICE_URL: http://payment-service:8083
      ODM_SERVICE_URL: http://odm-service:8085
      TEMPORAL_DEMO_DELAY_ENABLED: ${TEMPORAL_DEMO_DELAY_ENABLED:-true}
      TEMPORAL_DEMO_DELAY_SECONDS: ${TEMPORAL_DEMO_DELAY_SECONDS:-10}
    ports:
      - "8081:8081"
    networks:
      - default
      - temporal-network
    depends_on:
      order-postgres:
        condition: service_healthy
      solace:
        condition: service_healthy
      temporal-create-namespace:
        condition: service_completed_successfully
      # Its Activities call these three over REST.
      inventory-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      odm-service:
        condition: service_healthy
    healthcheck: *app-healthcheck
    stop_grace_period: 30s

networks:
  temporal-network:
    driver: bridge
    name: temporal-network

volumes:
  order-postgres-data:
  inventory-postgres-data:
  payment-postgres-data:
  odm-postgres-data:
  temporal-postgres-data:
  solace-data:
